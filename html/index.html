<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Page</title>
</head>
<body>

    <div id="block"></div>

    <script>
        
       let students = [

        { name: "Rahim", age: 20 },
        { name: "Karim", age: 22 },
        { name: "Mina", age: 21 }

        ]; 

        let student = students.map(student => {

            return `

                <div class='student'>

                    <h3>Name: ${student.name}</h3>
                    <p>Age: ${student.age}</p>           

                </div> 

                `;
        });

        document.getElementById("block").innerHTML =  student.join("");

    </script>
    
</body>
</html>
